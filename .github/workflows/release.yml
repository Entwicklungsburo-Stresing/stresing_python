name: Release

# Runs when a version tag is pushed, e.g. by "git push origin master 4.25.0" after scripts/prepare_release.py.
# Checks the tag against pyproject.toml and CHANGELOG.md, builds wheel and sdist
# and creates a draft release with the packages attached.
# Publishing the draft starts publish.yml (PyPI, Nextcloud).
# If the tagged commit is not on master (e.g. ci/release-test), it is a test: the draft is a pre-release,
# the package is called stresing-test and publish.yml uploads it to TestPyPI.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.post[0-9]+'

jobs:
  # Check the tag and decide if it is a test
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      eslscdll: ${{ steps.check.outputs.eslscdll }}
      sha: ${{ steps.check.outputs.sha }}
      test: ${{ steps.test.outputs.test }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, to check if the tagged commit is on master

      # 1. No release for this tag yet, pyproject.toml has the version, CHANGELOG.md a section with entries
      - name: Check tag, pyproject.toml and CHANGELOG.md
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 1
          fi

          project_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$project_version" != "$VERSION" ]; then
            echo "pyproject.toml contains version $project_version, but the tag is $VERSION"
            exit 1
          fi

          entries=$(awk -v v="$VERSION" '
            $1 == "##" && $2 == v { found = 1; next }
            found && /^## / { exit }
            found && /^\* / { n++ }
            END { print n + 0 }
          ' CHANGELOG.md)
          if [ "$entries" -eq 0 ]; then
            echo "CHANGELOG.md has no section '## $VERSION' with entries"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "eslscdll=${VERSION%%.post*}"    # 4.25.0.post1 -> 4.25.0 (ESLSCDLL version, Nextcloud folder)
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      # 2. Test release: tagged commit is not on master, or the EBST_CAM release is a pre-release
      - name: Test or real release
        id: test
        env:
          GH_TOKEN: ${{ github.token }}
          ESLSCDLL: ${{ steps.check.outputs.eslscdll }}
        run: |
          git fetch origin master
          if git merge-base --is-ancestor HEAD origin/master; then on_master=true; else on_master=false; fi
          ebst_prerelease=$(gh release view "$ESLSCDLL" --repo Entwicklungsburo-Stresing/EBST_CAM \
            --json isPrerelease --jq .isPrerelease 2> /dev/null || echo false)
          if [ "$on_master" = true ] && [ "$ebst_prerelease" != true ]; then
            test=false
          else
            test=true
          fi
          echo "On master: $on_master, EBST_CAM pre-release: $ebst_prerelease, test: $test"
          echo "test=$test" >> "$GITHUB_OUTPUT"

  # Build the packages and create the draft release
  release:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TEST: ${{ needs.prepare.outputs.test }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Build wheel and sdist
        run: |
          # TestPyPI project is called stresing-test, because stresing is already taken there
          if [ "$TEST" = true ]; then
            sed -i 's/^name = "stresing"$/name = "stresing-test"/' pyproject.toml
            grep '^name' pyproject.toml
          fi
          python3 -m pip install build
          python3 -m build
          ls -l dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          # previous version = next version heading below this one in CHANGELOG.md
          prev=$(awk -v v="$VERSION" '
            $1 == "##" && $2 == v { found = 1; next }
            found && $1 == "##" && $2 ~ /^[0-9]+(\.[0-9]+)+(\.post[0-9]+)?$/ { print $2; exit }
          ' CHANGELOG.md)

          # section of this version, without the heading and without empty ### headings
          awk -v v="$VERSION" '
            $1 == "##" && $2 == v { found = 1; next }
            found && /^## / { exit }
            !found { next }
            /^### / { h = $0; next }
            /^[[:space:]]*$/ { next }
            {
              if (h != "") { print h; h = "" }
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ -n "$prev" ]; then
            {
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$VERSION"
            } >> release-notes.md
          fi
          cat release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "$TEST" = true ]; then prerelease="--prerelease"; fi
          gh release create "$VERSION" $prerelease \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md \
            dist/*